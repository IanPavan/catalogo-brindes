<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Brindes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .produto-count {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.2em;
            color: #333;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .produto-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .produto-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .produto-imagem {
            width: 100%;
            height: 250px;
            background-color: #f0f0f0;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .produto-imagem img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .produto-imagem:hover img {
            transform: scale(1.05);
        }

        .zoom-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .produto-imagem:hover .zoom-icon {
            opacity: 1;
        }

        .produto-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .produto-codigo {
            background: #2ecc71;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 12px;
            width: fit-content;
        }

        .produto-nome {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .produto-detalhe {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }

        .produto-detalhe strong {
            color: #2ecc71;
        }

        .produto-botao {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            margin-top: auto;
            transition: background 0.3s;
        }

        .produto-botao:hover {
            background: #27ae60;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-conteudo {
            position: relative;
            background: white;
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            overflow: hidden;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-imagem {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
            background: #f0f0f0;
        }

        .modal-fechar {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.7);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .modal-fechar:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .modal-info {
            background: white;
            padding: 20px;
            text-align: center;
        }

        .modal-info h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .modal-info p {
            color: #666;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .produto-imagem {
                height: 180px;
            }

            .modal-conteudo {
                max-width: 95%;
                max-height: 95vh;
            }
        }
    </style>
</head>

            </div>
        </div>
    </div>

        function renderizarProdutos() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            produtos.forEach(produto => {
                if (!produto.nome) return;

                const card = document.createElement('div');
                card.className = 'produto-card';

                let detalhes = '';
                if (produto.medidas) detalhes += `<div class="produto-detalhe"><strong>Medidas:</strong> ${produto.medidas}</div>`;
                if (produto.peso) detalhes += `<div class="produto-detalhe"><strong>Peso:</strong> ${produto.peso}</div>`;

                card.innerHTML = `
                    <div class="produto-imagem" onclick="abrirModal('${produto.imagem.replace(/'/g, "&#39;")}', '${produto.nome.replace(/'/g, "&#39;")}', '${detalhes.replace(/'/g, "&#39;")}')">
                        <img src="${produto.imagem}" alt="${produto.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22250%22 height=%22250%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22250%22 height=%22250%22/%3E%3C/svg%3E'">
                        <div class="zoom-icon">🔍</div>
                    </div>
                    <div class="produto-info">
                        <span class="produto-codigo">${produto.codigo}</span>
                        <div class="produto-nome">${produto.nome}</div>
                        ${detalhes}
                        <button class="produto-botao" onclick="adicionarCarrinho('${produto.codigo}', '${produto.nome.replace(/'/g, "&#39;")}')">Adicionar ao Carrinho →</button>
                    </div>
                `;

                grid.appendChild(card);
            });

            document.getElementById('produto-count').textContent = `${produtos.length} produtos disponíveis`;
        }

        function abrirModal(imagem, nome, detalhes) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-imagem').src = imagem;
            document.getElementById('modal-titulo').textContent = nome;
            document.getElementById('modal-detalhes').innerHTML = detalhes;
            modal.classList.add('active');
        }

        function fecharModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                fecharModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                fecharModal();
            }
        });

        function adicionarCarrinho(codigo, nome) {
            alert(`✅ ${nome} (${codigo}) adicionado ao carrinho!\n\nEntre em contato para fazer o pedido.`);
        }

        renderizarProdutos();
    </script>
