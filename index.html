<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Brindes Corporativos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* CARRINHO NO TOPO */
        .carrinho-flutuante {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: #2ecc71;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .carrinho-flutuante:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .carrinho-contador {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .carrinho-icone {
            font-size: 1.8em;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: fadeIn 0.8s ease-in;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-box button {
            padding: 15px 30px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .search-box button:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            animation: fadeIn 0.8s ease-in 0.2s both;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .card-image {
            width: 100%;
            height: 220px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            padding: 10px;
        }

        .card-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-content h3 {
            color: #333;
            font-size: 1em;
            margin-bottom: 8px;
            line-height: 1.3;
            word-break: break-word;
            font-weight: 600;
        }

        .card-content p {
            color: #666;
            font-size: 0.85em;
            margin: 4px 0;
            line-height: 1.3;
        }

        .card-content .label {
            font-weight: 600;
            color: #444;
        }

        /* PAGINATION */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .pagination button,
        .pagination span {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .pagination button:hover:not(:disabled) {
            background: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .active {
            background: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }

        .pagination-info {
            text-align: center;
            color: white;
            margin-top: 15px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 900;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            animation: slideUp 0.3s;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #c0392b;
            transform: rotate(90deg);
        }

        .modal-image {
            width: 100%;
            height: 400px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        .modal-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .modal-info h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .modal-info p {
            color: #666;
            margin: 10px 0;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .modal-divider {
            border-top: 1px solid #eee;
            margin: 20px 0;
        }

        .form-group {
            margin: 15px 0;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .aviso-whatsapp {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px;
            margin: 12px 0;
            font-size: 0.9em;
            color: #333;
            line-height: 1.5;
        }

        .aviso-whatsapp strong {
            display: block;
            color: #ffc107;
            margin-bottom: 5px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.95em;
            background: #2ecc71;
            color: white;
        }

        .modal-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        /* OVERLAY DO CARRINHO */
        .carrinho-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 940;
            cursor: pointer;
        }

        .carrinho-overlay.active {
            display: block;
        }

        /* PAINEL DO CARRINHO */
        .carrinho-painel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: white;
            z-index: 1000;
            box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            overflow-y: auto;
            animation: slideInRight 0.3s;
        }

        .carrinho-painel.active {
            display: flex;
            flex-direction: column;
        }

        .carrinho-painel-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .carrinho-painel-header h2 {
            font-size: 1.5em;
        }

        .carrinho-fechar {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
        }

        .carrinho-lista {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .carrinho-item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #2ecc71;
        }

        .carrinho-item-nome {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .carrinho-item-codigo {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
        }

        .carrinho-item-controles {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .carrinho-item-controles label {
            font-size: 0.85em;
            color: #666;
        }

        .carrinho-item-controles input {
            width: 60px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-size: 0.85em;
        }

        .carrinho-remover {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
            margin-left: auto;
        }

        .carrinho-remover:hover {
            background: #c0392b;
        }

        .carrinho-vazio {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .carrinho-footer {
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .carrinho-total {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #333;
        }

        .carrinho-enviar {
            width: 100%;
            padding: 15px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }

        .carrinho-enviar:hover {
            background: #1fa355;
            transform: translateY(-2px);
        }

        .carrinho-enviar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ANIMAÇÕES */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        /* RESPONSIVO */
        /* TABLET (até 768px) */
        @media (max-width: 768px) {
            .carrinho-painel {
                max-width: 100%;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }

            header h1 {
                font-size: 2em;
            }

            .modal-content {
                padding: 20px;
            }

            .modal-buttons {
                flex-direction: column;
            }
        }

        /* CELULAR - FORÇA 2 COLUNAS (vem DEPOIS de 768px, então tem precedência) */
        @media (max-width: 600px) {
            body {
                padding: 60px 12px 20px;
            }

            .carrinho-flutuante {
                width: 50px;
                height: 50px;
                top: 15px;
                right: 15px;
            }

            .carrinho-icone {
                font-size: 1.5em;
            }

            header h1 {
                font-size: 1.8em;
            }

            header p {
                font-size: 0.95em;
            }

            .search-box {
                flex-direction: column;
                margin-bottom: 20px;
            }

            .search-box input,
            .search-box button {
                width: 100%;
                padding: 12px 15px;
                font-size: 0.95em;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px !important;
                margin-bottom: 30px;
            }

            .card {
                min-width: 0;
            }

            .card-image {
                height: 130px;
            }

            .card-content {
                padding: 8px;
            }

            .card-content h3 {
                font-size: 0.8em;
                margin-bottom: 4px;
                line-height: 1.2;
            }

            .card-content p {
                font-size: 0.65em;
                margin: 2px 0;
                line-height: 1.2;
            }

            .card-content .label {
                font-size: 0.65em;
            }

            .pagination {
                gap: 5px;
                margin: 20px 0;
            }

            .pagination button,
            .pagination span {
                padding: 8px 12px;
                font-size: 0.9em;
            }
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
    </style>
</head>

    <div class="container">

            <button onclick="buscar()">🔍 Buscar</button>

        <div class="grid" id="grid">

        </div>

        <div class="pagination" id="pagination"></div>

    <div class="modal" id="modal">

            </div>

            <div class="modal-info" id="modalInfo"></div>

            <div class="modal-divider"></div>

            <div class="form-group">
                <label>Quantidade:</label>
                <input type="number" id="quantidadeInput" value="1" min="1">
            </div>

            <div class="form-group">
                <label>Frase para gravação (opcional):</label>
                <textarea id="personalizacaoInput" placeholder="Digite a frase desejada..."></textarea>
                <div class="aviso-whatsapp">
                    <strong>💡 Dica:</strong>
                    Quer anexar uma imagem de referência para a personalização? Envie direto pelo WhatsApp junto com seu pedido.
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-button" onclick="adicionarCarrinho()">
                    🛒 Adicionar ao Carrinho
                </button>
            </div>
        </div>
    </div>

    <!-- OVERLAY DO CARRINHO -->
    <div class="carrinho-overlay" id="carrinhoOverlay"></div>

    <!-- PAINEL DO CARRINHO -->
    <div class="carrinho-painel" id="carrinhoPanel">
        <div class="carrinho-painel-header">
            <h2>Seu Carrinho</h2>
            <button class="carrinho-fechar" onclick="fecharCarrinho()">✕</button>
        </div>

        <div class="carrinho-lista" id="carrinhoLista">
            <div class="carrinho-vazio">Carrinho vazio</div>
        </div>

        <div class="carrinho-footer">
            <div class="carrinho-total" id="carrinhoTotal"></div>
            <button class="carrinho-enviar" id="enviarBtn" onclick="enviarOrçamento()" disabled>
                📲 Enviar Orçamento via WhatsApp
            </button>
        </div>
    </div>

            const produtosPagina = produtosAtivos.slice(inicio, fim);

            if (produtosPagina.length === 0) {
                grid.innerHTML = '<div class="no-results">Nenhum produto encontrado</div>';
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('paginationInfo').innerHTML = '';
                return;
            }

            grid.innerHTML = produtosPagina.map(p => `
                <div class="card" onclick="abrirModal('${p.codigo}')">
                    <div class="card-image">
                        <img src="${BASE_URL}${p.codigo}.jpeg" alt="${p.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23eee%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3EImagem não encontrada%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="card-content">
                        <h3>${p.nome}</h3>
                        <p><span class="label">Código:</span> ${p.codigo}</p>
                        ${p.medidas ? `<p><span class="label">Medidas:</span> ${p.medidas}</p>` : ''}
                        ${p.peso ? `<p><span class="label">Peso:</span> ${p.peso}</p>` : ''}
                    </div>
                </div>
            `).join('');

            renderizarPaginacao(totalPaginas);
            document.getElementById('paginationInfo').textContent = `Página ${pagina} de ${totalPaginas} • ${produtosAtivos.length} produtos`;
        }

        function renderizarPaginacao(totalPaginas) {
            const paginacao = document.getElementById('pagination');
            let html = `<button ${paginaAtual === 1 ? 'disabled' : ''} onclick="renderizar(${paginaAtual - 1})">← Anterior</button>`;

            let inicio = Math.max(1, paginaAtual - 2);
            let fim = Math.min(totalPaginas, paginaAtual + 2);

            if (inicio > 1) {
                html += `<button onclick="renderizar(1)">1</button>`;
                if (inicio > 2) html += `<span>...</span>`;
            }

            for (let i = inicio; i <= fim; i++) {
                html += `<button class="${i === paginaAtual ? 'active' : ''}" onclick="renderizar(${i})">${i}</button>`;
            }

            if (fim < totalPaginas) {
                if (fim < totalPaginas - 1) html += `<span>...</span>`;
                html += `<button onclick="renderizar(${totalPaginas})">${totalPaginas}</button>`;
            }

            html += `<button ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="renderizar(${paginaAtual + 1})">Próximo →</button>`;

            paginacao.innerHTML = html;
        }

        function buscar() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            
            if (!termo) {
                produtosAtivos = PRODUTOS_ORIGINAIS;
            } else {
                produtosAtivos = PRODUTOS_ORIGINAIS.filter(p => 
                    p.codigo.toLowerCase().includes(termo) ||
                    p.nome.toLowerCase().includes(termo)
                );
            }
            
            renderizar(1);
        }

        function abrirModal(codigo) {
            const produto = PRODUTOS_ORIGINAIS.find(p => p.codigo === codigo);
            if (!produto) {
                console.error(`Produto não encontrado: ${codigo}`);
                return;
            }

            console.log('Abrindo modal - Produto:', produto);
            
            produtoAtualModal = produto;

            document.getElementById('modalImg').src = `${BASE_URL}${codigo}.jpeg`;
            document.getElementById('modalInfo').innerHTML = `
                <h2>${produto.nome}</h2>
                <p><strong>Código:</strong> ${produto.codigo}</p>
                ${produto.medidas ? `<p><strong>Medidas:</strong> ${produto.medidas}</p>` : ''}
                ${produto.medidas_gravacao ? `<p><strong>Medidas para Gravação:</strong> ${produto.medidas_gravacao}</p>` : ''}
                ${produto.peso ? `<p><strong>Peso:</strong> ${produto.peso}</p>` : ''}
            `;

            document.getElementById('quantidadeInput').value = 1;
            document.getElementById('personalizacaoInput').value = '';
            
            document.getElementById('modal').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modal').classList.remove('active');
            produtoAtualModal = null;
        }

        // Fechar ao clicar no overlay do carrinho
        document.getElementById('carrinhoOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'carrinhoOverlay') {
                fecharCarrinho();
            }
        });

        // Fechar ao pressionar ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                fecharModal();
                fecharCarrinho();
            }
        });

        // Fechar modal ao clicar no overlay do modal
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') fecharModal();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscar();
        });

        renderizar(1);
    </script>
</body>
</html>
