<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Brindes Corporativos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: fadeIn 0.8s ease-in;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-box button {
            padding: 15px 30px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .search-box button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            animation: fadeIn 0.8s ease-in 0.2s both;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .card-image {
            width: 100%;
            height: 220px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            padding: 10px;
        }

        .card-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-content h3 {
            color: #333;
            font-size: 1em;
            margin-bottom: 8px;
            line-height: 1.3;
            word-break: break-word;
            font-weight: 600;
        }

        .card-content p {
            color: #666;
            font-size: 0.85em;
            margin: 4px 0;
            line-height: 1.3;
        }

        .card-content .label {
            font-weight: 600;
            color: #444;
        }

        /* Paginação */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .pagination button,
        .pagination span {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .pagination button:hover {
            background: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .active {
            background: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }

        .pagination-info {
            text-align: center;
            color: white;
            font-size: 1em;
            margin-top: 15px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            animation: slideUp 0.3s;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #c0392b;
            transform: rotate(90deg);
        }

        .modal-image {
            width: 100%;
            max-height: 400px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .modal-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .modal-info h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .modal-info p {
            color: #666;
            margin: 10px 0;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .modal-info strong {
            color: #333;
        }

        .modal-divider {
            border-top: 1px solid #eee;
            margin: 20px 0;
        }

        .form-group {
            margin: 15px 0;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .carrinho-button {
            background: #2ecc71;
            color: white;
        }

        .carrinho-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .whatsapp-button {
            background: #25d366;
            color: white;
        }

        .whatsapp-button:hover {
            background: #1fa355;
            transform: translateY(-2px);
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }

            header h1 {
                font-size: 2em;
            }

            .modal-content {
                padding: 20px;
            }

            .modal-buttons {
                grid-template-columns: 1fr;
            }

            .card-content h3 {
                font-size: 0.9em;
            }
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎁 Catálogo de Brindes</h1>
            <p>Personalizados & Corporativos</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por nome ou código...">
            <button onclick="buscar()">🔍 Buscar</button>
        </div>

        <div class="grid" id="grid">
            <div class="no-results">Carregando produtos...</div>
        </div>

        <!-- Paginação -->
        <div class="pagination" id="pagination"></div>
        <div class="pagination-info" id="paginationInfo"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal()">✕</button>
            
            <div class="modal-image">
                <img id="modalImg" src="" alt="Produto">
            </div>

            <div class="modal-info" id="modalInfo"></div>

            <div class="modal-divider"></div>

            <div class="form-group">
                <label>Quantidade:</label>
                <input type="number" id="quantidadeInput" value="1" min="1">
            </div>

            <div class="form-group">
                <label>Frase para gravação (opcional):</label>
                <textarea id="personalizacaoInput" placeholder="Digite a frase desejada..."></textarea>
            </div>

            <div class="modal-buttons">
                <button class="modal-button carrinho-button" onclick="adicionarCarrinho()">
                    🛒 Adicionar ao Carrinho
                </button>
                <button class="modal-button whatsapp-button" onclick="enviarWhatsApp()">
                    📲 Enviar Orçamento
                </button>
            </div>
        </div>
    </div>

                <div class="card" onclick="abrirModal('${p.codigo}')">
                    <div class="card-image">
                        <img src="${BASE_URL}${p.codigo}.jpeg" alt="${p.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23eee%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3EImagem não encontrada%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="card-content">
                        <h3>${p.nome}</h3>
                        <p><span class="label">Código:</span> ${p.codigo}</p>
                        ${p.medidas ? `<p><span class="label">Medidas:</span> ${p.medidas}</p>` : ''}
                        ${p.peso ? `<p><span class="label">Peso:</span> ${p.peso}</p>` : ''}
                    </div>
                </div>
            `).join('');

            // Renderizar paginação
            renderizarPaginacao(totalPaginas);
            
            // Info de paginação
            document.getElementById('paginationInfo').textContent = `Página ${pagina} de ${totalPaginas} • ${produtosAtivos.length} produtos`;
        }

        function renderizarPaginacao(totalPaginas) {
            const paginacao = document.getElementById('pagination');
            let html = '';

            // Botão Anterior
            html += `<button ${paginaAtual === 1 ? 'disabled' : ''} onclick="renderizar(${paginaAtual - 1})">← Anterior</button>`;

            // Números de página
            let inicio = Math.max(1, paginaAtual - 2);
            let fim = Math.min(totalPaginas, paginaAtual + 2);

            if (inicio > 1) {
                html += `<button onclick="renderizar(1)">1</button>`;
                if (inicio > 2) html += `<span>...</span>`;
            }

            for (let i = inicio; i <= fim; i++) {
                html += `<button class="${i === paginaAtual ? 'active' : ''}" onclick="renderizar(${i})">${i}</button>`;
            }

            if (fim < totalPaginas) {
                if (fim < totalPaginas - 1) html += `<span>...</span>`;
                html += `<button onclick="renderizar(${totalPaginas})">${totalPaginas}</button>`;
            }

            // Botão Próximo
            html += `<button ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="renderizar(${paginaAtual + 1})">Próximo →</button>`;

            paginacao.innerHTML = html;
        }

        function buscar() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            
            if (!termo) {
                produtosAtivos = PRODUTOS_ORIGINAIS;
            } else {
                produtosAtivos = PRODUTOS_ORIGINAIS.filter(p => 
                    p.codigo.toLowerCase().includes(termo) ||
                    p.nome.toLowerCase().includes(termo)
                );
            }
            
            renderizar(1);
        }

        function abrirModal(codigo) {
            const produto = PRODUTOS_ORIGINAIS.find(p => p.codigo === codigo);
            if (!produto) return;

            produtoAtualModal = produto;

            document.getElementById('modalImg').src = `${BASE_URL}codigo}.jpeg`;
            document.getElementById('modalInfo').innerHTML = `
                <h2>${produto.nome}</h2>
                <p><strong>Código:</strong> ${produto.codigo}</p>
                ${produto.medidas ? `<p><strong>Medidas:</strong> ${produto.medidas}</p>` : ''}
                ${produto.medidas_gravacao ? `<p><strong>Medidas para Gravação:</strong> ${produto.medidas_gravacao}</p>` : ''}
                ${produto.peso ? `<p><strong>Peso:</strong> ${produto.peso}</p>` : ''}
            `;

            document.getElementById('quantidadeInput').value = 1;
            document.getElementById('personalizacaoInput').value = '';
            
            document.getElementById('modal').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modal').classList.remove('active');
            produtoAtualModal = null;
        }

        function adicionarCarrinho() {
            if (!produtoAtualModal) return;
            
            const quantidade = document.getElementById('quantidadeInput').value;
            const personalizacao = document.getElementById('personalizacaoInput').value;
            
            let msg = `✅ ${produtoAtualModal.nome}\n`;
            msg += `Código: ${produtoAtualModal.codigo}\n`;
            msg += `Quantidade: ${quantidade}\n`;
            if (personalizacao) msg += `Frase: ${personalizacao}\n`;
            
            alert(msg + `\nAdicionado ao carrinho!`);
        }

        function enviarWhatsApp() {
            if (!produtoAtualModal) return;
            
            const quantidade = document.getElementById('quantidadeInput').value;
            const personalizacao = document.getElementById('personalizacaoInput').value;
            
            let mensagem = `Olá! Gostaria de solicitar um orçamento:\n\n`;
            mensagem += `📦 Produto: ${produtoAtualModal.nome}\n`;
            mensagem += `🔖 Código: ${produtoAtualModal.codigo}\n`;
            mensagem += `📊 Quantidade: ${quantidade}\n`;
            
            if (personalizacao) {
                mensagem += `✍️ Frase: ${personalizacao}\n`;
            }
            
            mensagem += `\nPor favor, me envie o orçamento.`;
            
            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }

        // Fechar modal com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });

        // Fechar modal ao clicar fora
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') fecharModal();
        });

        // Buscar com Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscar();
        });

        // Inicializar
        renderizar(1);
    </script>
</body>
</html>
