<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Brindes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #25D366;
            --dark: #333;
            --light: #f5f5f5;
            --border: #ddd;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--light);
            color: var(--dark);
        }
        
        .navbar {
            background: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-weight: 700;
            font-size: 20px;
            cursor: pointer;
        }
        
        .btn {
            background: none;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            color: var(--dark);
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            border-radius: 6px;
            margin-left: auto;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            text-align: center;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        
        .card-code {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .page-btn {
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        .modal-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .modal-code {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .info-group {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 16px;
            color: var(--dark);
        }
        
        .qty-group {
            margin-bottom: 20px;
        }
        
        .qty-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .qty-control {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .qty-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
        }
        
        .qty-input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
        
        .phrase-group {
            margin-bottom: 20px;
        }
        
        .phrase-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .phrase-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }
        
        .phrase-hint {
            background: #e8f5e9;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            color: #2e7d32;
            margin-bottom: 16px;
        }
        
        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn-full {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-success {
            background: var(--primary);
            color: white;
        }
        
        .btn-cancel {
            background: #f0f0f0;
            color: var(--dark);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo" onclick="showHome()">🎁 Catálogo</div>
        <button class="btn" onclick="showHome()">Produtos</button>
        <button class="btn btn-primary" id="cartBtn" style="display:none;" onclick="showCart()">
            🛒 Carrinho <span id="cartCount">0</span>
        </button>
    </div>

    <!-- HOME PAGE -->
    <div id="homePage" class="container">
        <div id="productsContainer" class="products"></div>
        <div id="paginationContainer" class="pagination"></div>
    </div>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-code" id="modalCode"></div>
            <div class="modal-image" id="modalImage"></div>
            <h2 class="modal-title" id="modalTitle"></h2>
            
            <div class="info-group">
                <div class="info-label">Medidas</div>
                <div class="info-value" id="modalMedidas"></div>
            </div>
            
            <div class="info-group">
                <div class="info-label">Medidas para Gravação</div>
                <div class="info-value" id="modalMedidasGravacao"></div>
            </div>
            
            <div class="info-group">
                <div class="info-label">Peso</div>
                <div class="info-value" id="modalPeso"></div>
            </div>

            <div class="qty-group">
                <label class="qty-label">Quantidade:</label>
                <div class="qty-control">
                    <button class="qty-btn" onclick="decreaseQty()">−</button>
                    <input type="number" class="qty-input" id="qtyInput" value="1" min="1">
                    <button class="qty-btn" onclick="increaseQty()">+</button>
                </div>
            </div>

            <div class="phrase-group">
                <label class="phrase-label">📝 Frase/Texto (Opcional):</label>
                <input type="text" class="phrase-input" id="phraseInput" placeholder="Ex: Empresa XYZ - 2024">
            </div>

            <div class="phrase-hint">
                <strong>📎 Arquivos/Fotos?</strong><br>
                Caso queira enviar logo, imagem ou arquivo para personalização, envie <strong>direto no WhatsApp</strong> após fazer seu orçamento!
            </div>

            <div class="modal-buttons">
                <button class="btn-full btn-success" onclick="addToCart()">🛒 Adicionar</button>
                <button class="btn-full btn-cancel" onclick="closeModal()">❌ Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = '5544991140169';
        const SHEET_ID = '1qQXicJuTs-0JyoaylNk1wPfoaCBdtoNh7-vmvjmvPQI';
        const ITEMS_PER_PAGE = 60;
        
        let products = [];
        let cart = [];
        let currentPage = 1;
        let selectedProduct = null;
        let quantity = 1;

        async function loadProducts() {
            try {
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
                const response = await fetch(csvUrl);
                const csv = await response.text();
                
                const lines = csv.trim().split('\n');
                const headers = lines[0].split(',');
                
                products = lines.slice(1).map(line => {
                    const values = line.split(',');
                    return {
                        id: values[0]?.trim() || '',
                        codigo: values[0]?.trim() || '',
                        nome: values[1]?.trim() || '',
                        medidas: values[2]?.trim() || '',
                        medidas_gravacao: values[3]?.trim() || '',
                        peso: values[4]?.trim() || '',
                        imagem: values[5]?.trim() || ''
                    };
                }).filter(p => p.codigo && p.nome);
                
                console.log(`Carregados ${products.length} produtos`);
                renderHome();
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
                document.getElementById('productsContainer').innerHTML = '<p class="loading">Erro ao carregar produtos. Verifique se a planilha está compartilhada.</p>';
            }
        }

        function renderHome() {
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageProducts = products.slice(start, end);

            const html = pageProducts.map(p => `
                <div class="card" onclick="openProduct('${p.codigo}')">
                    <div class="card-code">${p.codigo}</div>
                </div>
            `).join('');
            
            document.getElementById('productsContainer').innerHTML = html || '<p class="loading">Nenhum produto encontrado</p>';
            
            const totalPages = Math.ceil(products.length / ITEMS_PER_PAGE);
            const paginationHtml = Array.from({length: totalPages}, (_, i) => `
                <button class="page-btn ${i+1 === currentPage ? 'active' : ''}" onclick="goToPage(${i+1})">${i+1}</button>
            `).join('');
            document.getElementById('paginationContainer').innerHTML = paginationHtml;
        }

        function openProduct(codigo) {
            selectedProduct = products.find(p => p.codigo === codigo);
            if (!selectedProduct) return;
            
            quantity = 1;
            document.getElementById('qtyInput').value = 1;
            document.getElementById('phraseInput').value = '';
            
            document.getElementById('modalCode').textContent = selectedProduct.codigo;
            document.getElementById('modalTitle').textContent = selectedProduct.nome;
            document.getElementById('modalMedidas').textContent = selectedProduct.medidas;
            document.getElementById('modalMedidasGravacao').textContent = selectedProduct.medidas_gravacao;
            document.getElementById('modalPeso').textContent = selectedProduct.peso;
            
            const modalImage = document.getElementById('modalImage');
            if (selectedProduct.imagem) {
                modalImage.innerHTML = `<img src="${selectedProduct.imagem}" alt="${selectedProduct.nome}" onerror="this.style.display='none'">`;
            } else {
                modalImage.innerHTML = '';
            }
            
            document.getElementById('productModal').classList.add('show');
        }

        function decreaseQty() {
            if (quantity > 1) quantity--;
            document.getElementById('qtyInput').value = quantity;
        }

        function increaseQty() {
            quantity++;
            document.getElementById('qtyInput').value = quantity;
        }

        function addToCart() {
            if (!selectedProduct || quantity < 1) return;
            
            const phrase = document.getElementById('phraseInput').value || '';
            
            cart.push({
                ...selectedProduct,
                cartQuantity: quantity,
                phrase,
                cartId: Date.now()
            });
            
            updateCartBadge();
            closeModal();
            showHome();
        }

        function updateCartBadge() {
            const btn = document.getElementById('cartBtn');
            if (cart.length > 0) {
                btn.style.display = 'inline-flex';
                document.getElementById('cartCount').textContent = cart.length;
            } else {
                btn.style.display = 'none';
            }
        }

        function showHome() {
            document.getElementById('homePage').style.display = 'block';
            renderHome();
        }

        function showCart() {
            if (cart.length === 0) {
                alert('Carrinho vazio');
                return;
            }
            openWhatsappModal();
        }

        function openWhatsappModal() {
            let msg = `*📋 PEDIDO DE ORÇAMENTO*\n\n*DETALHES DO PEDIDO:*\n\n`;
            
            cart.forEach((item, i) => {
                msg += `*${i+1}. [${item.codigo}] ${item.nome}*\n`;
                msg += `   📏 Medidas: ${item.medidas}\n`;
                msg += `   📦 Quantidade: ${item.cartQuantity}x\n`;
                if(item.phrase) msg += `   📝 Frase: "${item.phrase}"\n`;
                msg += `\n`;
            });
            
            msg += `*TOTAL: ${cart.length} item(ns)*\n\n---\nEnviado via Catálogo Online`;
            
            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encoded}`, '_blank');
            cart = [];
            updateCartBadge();
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('show');
        }

        function goToPage(page) {
            currentPage = page;
            renderHome();
            window.scrollTo(0, 0);
        }

        loadProducts();
    </script>
</body>
</html>
